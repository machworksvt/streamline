name: tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: streamline
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          create-args: python=3.11
          init-shell: powershell

      - name: Show micromamba info
        run: |
          micromamba info
          micromamba list -n streamline

      - name: Install project (editable) + test deps
        run: |
          micromamba run -n streamline python -m pip install --upgrade pip
          micromamba run -n streamline python -m pip install -e .
          micromamba run -n streamline python -m pip install pytest

      - name: Install OpenVSP runtime
        run: |
          $vspUrl = "https://openvsp.org/download.php?file=zips/current/windows/OpenVSP-3.46.0-win64-Python3.11.zip"
          $vspZip = Join-Path $PWD "OpenVSP.zip"
          Write-Host "Downloading OpenVSP from $vspUrl"
          Invoke-WebRequest -Uri $vspUrl -OutFile $vspZip -UseBasicParsing
          $vspRoot = Join-Path $PWD "OpenVSP-3.46.0-win64"
          if (Test-Path $vspRoot) { Remove-Item -Recurse -Force $vspRoot }
          Expand-Archive -Path $vspZip -DestinationPath $PWD -Force
          Remove-Item $vspZip
          $vspPython = Join-Path $vspRoot "python"
          $vspBin = Join-Path $vspRoot "bin"
          micromamba run -n streamline python -m pip install -r (Join-Path $vspPython "requirements-dev.txt")
          Add-Content $env:GITHUB_PATH $vspBin
          Add-Content $env:GITHUB_PATH $vspPython
          if ($env:PYTHONPATH) {
            Add-Content $env:GITHUB_ENV "PYTHONPATH=$vspPython;$env:PYTHONPATH"
          } else {
            Add-Content $env:GITHUB_ENV "PYTHONPATH=$vspPython"
          }
          micromamba run -n streamline python -c "import sys; import os; sys.path.append(r'$vspPython'); import openvsp; print('OpenVSP version:', openvsp.GetVSPVersion())"

      - name: Run tests
        run: |
          micromamba run -n streamline python -c "import sys; print('Python', sys.version)"
          micromamba run -n streamline pytest -vv --maxfail=1

      - name: Upload pytest results (always)
        if: always()
        run: |
          echo "(Placeholder for future artifact upload)"
